<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3248;--accent:#4f7bff;--text:#e2e8f0;--text2:#8892a4;--green:#22c55e;--red:#ef4444;--gold:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
.header{padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700;color:#fff}
.header .sub{color:var(--text2);font-size:12px}
.index-switch{display:flex;gap:8px;margin-left:auto;margin-right:16px}
.index-switch-btn{padding:6px 16px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:13px;transition:all .15s;font-weight:500}
.index-switch-btn:hover{border-color:var(--accent);color:var(--accent)}
.index-switch-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.update-time{color:var(--text2);font-size:12px}
.container{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 57px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px}
.sidebar-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;padding:8px 4px 6px}
.etf-item{padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .15s;margin-bottom:4px;border:1px solid transparent;position:relative}
.etf-item:hover{background:var(--surface2)}
.etf-item.active{background:rgba(79,123,255,.12);border-color:rgba(79,123,255,.4)}
.etf-name{font-size:13px;font-weight:600;color:var(--text)}
.etf-code{font-size:11px;color:var(--text2);margin-top:2px}
.etf-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 6px;border-radius:4px}
.tag-fee{background:rgba(79,123,255,.15);color:#7ba5ff}
.tag-fee-low{background:rgba(34,197,94,.15);color:#4ade80}
.tag-fee-high{background:rgba(239,68,68,.15);color:#f87171}
.etf-price{font-size:15px;font-weight:700;color:#fff;margin-top:4px}
.etf-premium-badge{font-size:11px;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px}
.premium-pos{background:rgba(239,68,68,.15);color:#f87171}
.premium-neg{background:rgba(34,197,94,.15);color:#4ade80}
.premium-zero{background:rgba(136,146,164,.15);color:var(--text2)}
.extreme-high{background:rgba(239,68,68,.24);color:#fca5a5;border:1px solid rgba(239,68,68,.35);font-weight:700}
.extreme-low{background:rgba(34,197,94,.22);color:#86efac;border:1px solid rgba(34,197,94,.35);font-weight:700}
.rank-excluded{background:rgba(136,146,164,.12);color:var(--text2)}
.select-all-row{display:flex;align-items:center;gap:8px;padding:6px 4px 10px;border-bottom:1px solid var(--border);margin-bottom:8px}
.select-all-row label{font-size:12px;color:var(--text2);cursor:pointer}
.main{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);padding:0 20px;flex-shrink:0}
.tab{padding:12px 20px;cursor:pointer;font-size:13px;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.chart-area{flex:1;padding:20px;overflow-y:auto}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.chart-card h3{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.chart-card .chart-desc{font-size:12px;color:var(--text2);margin-bottom:16px}
.chart-wrapper{position:relative;height:340px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-name{font-size:13px;font-weight:700}
.card-code{font-size:11px;color:var(--text2);margin-top:2px}
.metric{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.metric:last-child{border-bottom:none}
.metric-label{color:var(--text2);font-size:12px}
.metric-value{font-size:12px;font-weight:600}
.fee-bar{height:4px;border-radius:2px;background:var(--surface2);margin-top:10px;overflow:hidden}
.fee-fill{height:100%;border-radius:2px;transition:width .3s}
.range-btns{display:flex;gap:6px;margin-bottom:16px}
.range-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s}
.range-btn:hover{border-color:var(--accent);color:var(--accent)}
.range-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.alert-warn{padding:10px 16px;border-radius:8px;margin-bottom:16px;font-size:12px;display:flex;align-items:center;gap:8px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fbbf24}
.alert-info{padding:10px 16px;border-radius:8px;margin-bottom:16px;font-size:12px;display:flex;align-items:center;gap:8px;background:rgba(79,123,255,.1);border:1px solid rgba(79,123,255,.3);color:#7ba5ff}
input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--accent)}
.check-wrap{position:absolute;top:10px;right:10px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.premium-table{width:100%;border-collapse:collapse;font-size:12px}
.premium-table th{background:var(--surface2);color:var(--text2);padding:8px 12px;text-align:left;font-weight:600}
.premium-table td{padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.04)}
.premium-table tr:hover td{background:rgba(255,255,255,.02)}
.passive-table-wrap{overflow-x:auto}
.passive-table{width:100%;min-width:1180px;border-collapse:collapse;font-size:12px}
.passive-table th{background:var(--surface2);color:var(--text2);padding:10px 12px;text-align:left;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1}
.passive-table th.passive-sortable{cursor:pointer;user-select:none}
.passive-table th.passive-sortable:hover{color:var(--accent);background:rgba(79,123,255,.12)}
.passive-sort-icon{display:inline-block;width:14px;margin-left:4px;color:var(--accent);font-size:11px}
.passive-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;white-space:nowrap}
.passive-table tbody tr:hover td{background:rgba(79,123,255,.06)}
.passive-name{font-weight:700;color:var(--text);white-space:normal;min-width:220px;line-height:1.45}
.passive-code{font-size:11px;color:var(--text2);margin-top:3px}
.passive-muted{color:var(--text2)}
.passive-nav{font-weight:700;color:#fbbf24}
.passive-status{display:inline-block;padding:3px 8px;border-radius:5px;background:rgba(245,158,11,.12);color:#fbbf24}
.passive-status.paused{background:rgba(239,68,68,.14);color:#f87171}
.passive-limit{font-weight:700;color:#fbbf24}
.passive-fee{color:#84cc16}
.passive-source{font-size:11px;color:var(--text2);margin-top:12px}
.passive-toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}
.passive-filter-label{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:12px;white-space:nowrap}
.passive-filter{padding:7px 28px 7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;cursor:pointer}
@media(max-width:700px){.passive-toolbar{align-items:stretch;flex-direction:column}.passive-filter-label{justify-content:space-between}.passive-filter{flex:1}}
@media(max-width:900px){.passive-table{min-width:1080px}.chart-area{padding:12px}.chart-card{padding:14px}}
.pos-val{color:var(--red)}
.neg-val{color:var(--green)}
.zero-val{color:var(--text2)}
.holdings-mode .sidebar{display:none}
.holdings-mode .tabs{display:none}
.container.holdings-mode{grid-template-columns:1fr}
.container.passive-mode{grid-template-columns:1fr}
.passive-mode .sidebar{display:none}
.passive-mode .tabs{display:none}
.pf-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:4px}
.pf-field{display:flex;flex-direction:column;gap:4px}
.pf-field label{font-size:12px;color:var(--text2)}
.pf-input,.pf-select{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;min-width:150px}
.pf-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-weight:600;align-self:flex-end}
.pf-btn:hover{opacity:.9}
.pf-btn-ghost{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:13px}
.pf-btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.pf-account{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.pf-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.pf-subtotal td{background:rgba(59,130,246,.07);border-top:1px solid rgba(255,255,255,.1)}
.pf-subtotal{cursor:pointer}
.pf-subtotal:hover td{background:rgba(59,130,246,.13)}
.pf-caret{display:inline-block;width:12px;color:var(--text2);font-size:11px}
.pf-lot td{font-size:12px;color:var(--text2)}
.pf-lot td:nth-child(3){color:var(--text);font-weight:600}
.pf-lot td:last-child{white-space:nowrap}
.pf-lot td:last-child .pf-btn-mini+.pf-btn-mini{margin-left:6px}
.pf-btn-mini{padding:3px 9px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:11px;line-height:1.5}
.pf-btn-mini:hover{border-color:var(--accent);color:var(--accent)}
.pf-btn-mini-danger{opacity:.35;border-color:transparent}
.pf-btn-mini-danger:hover{opacity:1;border-color:rgba(239,68,68,.45);color:#f87171}
.pf-input-mini{padding:3px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;width:92px}
.pf-input-mini:focus{outline:none;border-color:var(--accent)}
.pf-lot-editing td{background:rgba(79,123,255,.06)}

<script>
function collectMonthly(prefix, startYear, startMonth) {
  const months = [];
  const now = new Date();
  let y = startYear, m = startMonth;
  while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth() + 1)) {
    const ym = '' + y + (m < 10 ? '0' + m : m);
    const vn = prefix + '_DATA_' + ym;
    if (new Function('return typeof ' + vn)() !== 'undefined') {
      months.push(new Function('return ' + vn)());
    }
    m++; if (m > 12) { m = 1; y++; }
  }
  return months;
}
function mergeMonthly(months) {
  const merged = {};
  months.forEach(m => {
    Object.keys(m).forEach(code => {
      const src = m[code];
      if (!merged[code]) {
        merged[code] = {
          ...src,
          price: [...(src.price || [])],
          premium: [...(src.premium || [])],
          nav: [...(src.nav || [])]
        };
      } else {
        merged[code].price = merged[code].price.concat(src.price || []);
        merged[code].premium = merged[code].premium.concat(src.premium || []);
        merged[code].nav = merged[code].nav.concat(src.nav || []);
      }
    });
  });
  Object.keys(merged).forEach(code => {
    merged[code].price.sort((a, b) => a.date.localeCompare(b.date));
    merged[code].premium.sort((a, b) => a.date.localeCompare(b.date));
    merged[code].nav.sort((a, b) => a.date.localeCompare(b.date));
  });
  return merged;
}
const ETF_DATA = mergeMonthly(collectMonthly('ETF', 2024, 5));
const SP500_DATA = mergeMonthly(collectMonthly('SP500', 2024, 5));
const US50_DATA = mergeMonthly(collectMonthly('US50', 2025, 12));
const DJIA_DATA = mergeMonthly(collectMonthly('DJIA', 2026, 1));
const NDX_PASSIVE_DATA = mergeMonthly(collectMonthly('NDX_PASSIVE', 2026, 9));

let currentIndex='ndx';
const INDEX_DATA={ndx:ETF_DATA,sp500:SP500_DATA,us50:US50_DATA,djia:DJIA_DATA,ndx_passive:NDX_PASSIVE_DATA};
const PREMIUM_RANKING_EXCLUSIONS={ndx:new Set(['sz159509']),sp500:new Set(),us50:new Set(),djia:new Set(),ndx_passive:new Set()};
const INDEX_NAMES={ndx:'纳斯达克100',sp500:'标普500',us50:'美国50 (MSCI)',djia:'道琼斯工业平均',ndx_passive:'纳指被动'};
const INDEX_TAGS={ndx:'NDX100',sp500:'SPX500',us50:'MSCI US50',djia:'DJIA',ndx_passive:'NDX PASSIVE'};
const INDEX_SUBS={ndx:Object.keys(ETF_DATA).length+'只基金 · 近两年逐日数据 · 价格/净值/折溢价/费率',sp500:Object.keys(SP500_DATA).length+'只基金 · 近两年逐日数据 · 价格/净值/折溢价/费率',us50:Object.keys(US50_DATA).length+'只基金 · 近5个月逐日数据 · 价格/净值/折溢价/费率',djia:Object.keys(DJIA_DATA).length+'只基金 · 近5个月逐日数据 · 价格/净值/折溢价/费率',ndx_passive:Object.keys(NDX_PASSIVE_DATA).length+'只场外基金 · 净值/费率/申购状态/每日额度'};
let ETF_DATA_ACTIVE=ETF_DATA;

function switchIndex(idx){
  if(idx===currentIndex)return;
  currentIndex=idx;
  passiveSort={key:null,dir:1};
  passiveStatusFilter='all';
  document.querySelector('.container').classList.toggle('passive-mode',idx==='ndx_passive');
  if(idx==='holdings'){
    document.querySelector('.container').classList.add('holdings-mode');
    document.querySelector('.container').classList.remove('passive-mode');
    document.querySelector('h1').innerHTML='&#128202; 我的持仓';
    document.getElementById('idxSub').textContent='记录持仓 · 自动清算 · 跨设备同步';
    document.querySelectorAll('.index-switch-btn').forEach(b=>{
      b.classList.toggle('active',b.dataset.idx===idx);
    });
    if(typeof window.renderHoldings==='function')window.renderHoldings();
    return;
  }
  document.querySelector('.container').classList.remove('holdings-mode');
  ETF_DATA_ACTIVE=INDEX_DATA[idx];
  ETF_CODES.length=0;
  ETF_CODES.push(...Object.keys(ETF_DATA_ACTIVE));
  selectedCodes.clear();
  selectedCodes.add(ETF_CODES[0]);
  if(ETF_CODES.length>1)selectedCodes.add(ETF_CODES[1]);
  currentRange='1y';
  document.querySelectorAll('.index-switch-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.idx===idx);
  });
  document.querySelector('h1').innerHTML='&#128202; '+INDEX_NAMES[idx]+' QDII ETF 分析';
  document.querySelector('.sub').textContent=INDEX_SUBS[idx];
  const tv=document.getElementById('tabValuation');
  if(tv)tv.style.display=idx==='ndx'?'':'none';
  if(idx!=='ndx'&&currentTab==='valuation'){
    currentTab='price';
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    const pt=document.querySelector('.tab[data-tab="price"]');
    if(pt)pt.classList.add('active');
  }
  renderAll();
}
const COLORS=['#4f7bff','#f59e0b','#22c55e','#ef4444','#a78bfa','#06b6d4','#f97316','#ec4899','#84cc16','#14b8a6','#e879f9','#64748b'];
const ETF_CODES=Object.keys(ETF_DATA_ACTIVE);
let selectedCodes=new Set([ETF_CODES[0],ETF_CODES[1]]);
let currentTab='price';
let currentRange='1y';
let charts={};
let passiveSort={key:null,dir:1};
let passiveStatusFilter='all';

function filterByRange(arr,range){
  if(!arr||!arr.length)return arr;
  const now=new Date();let cutoff;
  if(range==='3m'){cutoff=new Date(now);cutoff.setMonth(cutoff.getMonth()-3);}
  else if(range==='6m'){cutoff=new Date(now);cutoff.setMonth(cutoff.getMonth()-6);}
  else if(range==='1y'){cutoff=new Date(now);cutoff.setFullYear(cutoff.getFullYear()-1);}
  else return arr;
  const cs=cutoff.toISOString().slice(0,10);
  return arr.filter(d=>d.date>=cs);
}
function getLatestPremiumRecord(code){const a=ETF_DATA_ACTIVE[code].premium;return(!a||!a.length)?null:a[a.length-1];}
function getLatestPremium(code){const r=getLatestPremiumRecord(code);return r===null?null:r.value;}
function getLatestPrice(code){const a=ETF_DATA_ACTIVE[code].price;return(!a||!a.length)?null:a[a.length-1].value;}
function getLatestDate(key){
  let latest='';
  for(const code in ETF_DATA_ACTIVE){
    const arr=ETF_DATA_ACTIVE[code]&&ETF_DATA_ACTIVE[code][key];
    if(arr&&arr.length&&arr[arr.length-1].date>latest)latest=arr[arr.length-1].date;
  }
  return latest||'未知';
}
let LAST_UPDATE_NOTE='';
function updateFreshness(){
  const isOtc=currentIndex==='ndx_passive';
  let s=isOtc?'数据截止: 净值 '+getLatestDate('nav'):'数据截止: 价格 '+getLatestDate('price')+' · 净值 '+getLatestDate('nav');
  if(LAST_UPDATE_NOTE) s+=' · '+LAST_UPDATE_NOTE;
  document.getElementById('updateTime').textContent=s;
}
function premiumClass(v){if(v===null)return'zero-val';if(v>0.5)return'pos-val';if(v<-0.5)return'neg-val';return'zero-val';}
function premiumBadgeClass(v){if(v===null)return'premium-zero';if(v>0.5)return'premium-pos';if(v<-0.5)return'premium-neg';return'premium-zero';}
function feeColor(f){if(f<=0.60)return'#22c55e';if(f<=0.65)return'#84cc16';if(f<=0.80)return'#f59e0b';return'#ef4444';}

function renderSidebar(){
  const c=document.getElementById('etfList');c.innerHTML='';
  const rankingExclusions=PREMIUM_RANKING_EXCLUSIONS[currentIndex]||new Set();
  const currentPremiums=ETF_CODES.filter(code=>!rankingExclusions.has(code)).map(code=>getLatestPremium(code)).filter(value=>value!==null&&Number.isFinite(value));
  const highestPremium=currentPremiums.length?Math.max(...currentPremiums):null;
  const lowestPremium=currentPremiums.length?Math.min(...currentPremiums):null;
  ETF_CODES.forEach((code,i)=>{
    const etf=ETF_DATA_ACTIVE[code];
    const isOtc=etf.type==='otc';
    const price=isOtc?null:getLatestPrice(code);const premRecord=isOtc?null:getLatestPremiumRecord(code);const prem=premRecord===null?null:premRecord.value;
    const isSelected=selectedCodes.has(code);const color=COLORS[i%COLORS.length];
    const feeTag=etf.fee_total<=0.60?'tag-fee-low':etf.fee_total>=1.0?'tag-fee-high':'tag-fee';
    const excludedHtml=rankingExclusions.has(code)?'<span class="tag rank-excluded">不参与排名</span>':'';
    const extremeHtml=!isOtc&&!rankingExclusions.has(code)&&(prem===highestPremium?'<span class="tag extreme-high">溢价最高</span>':prem===lowestPremium?'<span class="tag extreme-low">溢价最低</span>':'');
    const item=document.createElement('div');
    item.className='etf-item'+(isSelected?' active':'');
    item.dataset.code=code;
    const priceHtml=price!==null?`<div class="etf-price" style="color:${color}">&#165;${price.toFixed(3)}</div>`:'';
    const quotaHtml=isOtc?(etf.purchase_status?`<span class="tag ${etf.purchase_limit===null?'tag-fee-high':'tag-fee'}">${etf.purchase_status}${etf.purchase_limit!==null?' '+etf.purchase_limit+'元':''}</span>`:'<span class="tag">额度待查</span>'):'';
    const premHtml=prem!==null?`<span class="etf-premium-badge ${premiumBadgeClass(prem)}" title="使用净值日期 ${premRecord.nav_date||premRecord.date}">${prem>0?'+':''}${prem.toFixed(2)}%</span>`:'';
    item.innerHTML=`<div class="check-wrap"><input type="checkbox" data-code="${code}" ${isSelected?'checked':''}></div>
      <div style="display:flex;align-items:center;gap:8px;margin-right:24px">
        <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0"></div>
        <div><div class="etf-name">${etf.name}</div><div class="etf-code">${code.toUpperCase()}${etf.share_code?' / '+etf.share_code:''}</div></div>
      </div>
      ${priceHtml}
      <div class="etf-tags"><span class="tag ${feeTag}">${etf.fee_total}%/年</span>${premHtml}${quotaHtml}${excludedHtml}${extremeHtml}</div>`;
    item.addEventListener('click',e=>{if(e.target.type==='checkbox')return;toggleSelect(code);});
    item.querySelector('input[type=checkbox]').addEventListener('change',e=>{
      if(e.target.checked)selectedCodes.add(code);else selectedCodes.delete(code);renderAll();
    });
    c.appendChild(item);
  });
  const ca=document.getElementById('chkAll');
  ca.checked=selectedCodes.size===ETF_CODES.length;
  ca.indeterminate=selectedCodes.size>0&&selectedCodes.size<ETF_CODES.length;
}
function toggleSelect(code){
  if(selectedCodes.has(code)){if(selectedCodes.size>1)selectedCodes.delete(code);}
  else selectedCodes.add(code);
  renderAll();
}
function renderAll(){
  updateFreshness();
  if(currentIndex==='ndx_passive'){
    renderNavTab();
    return;
  }
  renderSidebar();
  if(currentTab==='price')renderPriceTab();
  else if(currentTab==='premium')renderPremiumTab();
  else if(currentTab==='nav')renderNavTab();
  else if(currentTab==='info')renderInfoTab();
  else if(currentTab==='valuation')renderValuationTab();
}
function renderRangeBtns(active){
  const rs=[['3m','3个月'],['6m','6个月'],['1y','1年'],['all','全部']];
  return '<div class="range-btns">'+rs.map(([r,l])=>`<button class="range-btn ${active===r?'active':''}" data-range="${r}">${l}</button>`).join('')+'</div>';
}
function bindRangeBtns(){
  document.querySelectorAll('.range-btn').forEach(b=>b.addEventListener('click',()=>{currentRange=b.dataset.range;renderAll();}));
}
function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

function makeLineChart(canvasId,labels,datasets,yFmt){
  destroyChart(canvasId);
  const ctx=document.getElementById(canvasId).getContext('2d');
  charts[canvasId]=new Chart(ctx,{
    type:'line',
    data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:'#8892a4',font:{size:12},boxWidth:12,padding:16}},
        tooltip:{backgroundColor:'#1a1d27',borderColor:'#2e3248',borderWidth:1,titleColor:'#e2e8f0',bodyColor:'#8892a4',padding:10,
          callbacks:{label:c=>` ${c.dataset.label}: ${yFmt(c.parsed.y)}`}},
        zoom:{zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x'},pan:{enabled:true,mode:'x'}}
      },
      scales:{
        x:{ticks:{color:'#8892a4',maxTicksLimit:12,font:{size:11},maxRotation:30},grid:{color:'rgba(255,255,255,0.04)'}},
        y:{ticks:{color:'#8892a4',font:{size:11},callback:yFmt},grid:{color:'rgba(255,255,255,0.06)'}}
      }
    }
  });
}

function buildDatasets(key){
  const result=[];
  Array.from(selectedCodes).forEach(code=>{
    const etf=ETF_DATA_ACTIVE[code];const color=COLORS[ETF_CODES.indexOf(code)%COLORS.length];
    const filtered=filterByRange(etf[key],currentRange);
    result.push({label:etf.name,rawData:filtered,color});
  });
  const allDates=[...new Set(result.flatMap(d=>d.rawData.map(p=>p.date)))].sort();
  const datasets=result.map(d=>{
    const map=Object.fromEntries(d.rawData.map(p=>[p.date,p.value]));
    return{label:d.label,data:allDates.map(dt=>map[dt]??null),borderColor:d.color,backgroundColor:d.color+'12',borderWidth:1.8,pointRadius:0,tension:0.3};
  });
  return{allDates,datasets};
}

function renderPriceTab(){
  document.getElementById('chartArea').innerHTML=
    renderRangeBtns(currentRange)+
    '<div class="alert-info"><span>&#128161;</span>各ETF面值不同，价格绝对值不可直接比较涨幅。如需比较涨幅请切换"净值走势"查看归一化曲线。</div>'+
    '<div class="chart-card"><h3>市场价格走势（收盘价）</h3><div class="chart-desc">每交易日收盘价 &#183; 可滚轮缩放/拖拽</div><div class="chart-wrapper"><canvas id="chartPrice"></canvas></div></div>';
  bindRangeBtns();
  const {allDates,datasets}=buildDatasets('price');
  makeLineChart('chartPrice',allDates,datasets,v=>v!=null?'&#165;'+v.toFixed(3):'-');
}

function renderPremiumTab(){
  if(currentIndex==='ndx_passive'){
    renderNavTab();
    return;
  }
  let trs='';
  ETF_CODES.forEach((code,i)=>{
    const etf=ETF_DATA_ACTIVE[code];const premRecord=getLatestPremiumRecord(code);const prem=premRecord===null?null:premRecord.value;
    const arr=filterByRange(etf.premium,currentRange);
    const avg=arr.length?(arr.reduce((s,d)=>s+d.value,0)/arr.length).toFixed(3):'-';
    const maxP=arr.length?Math.max(...arr.map(d=>d.value)).toFixed(2):'-';
    const minP=arr.length?Math.min(...arr.map(d=>d.value)).toFixed(2):'-';
    const isSel=selectedCodes.has(code);
    const bg=isSel?'background:rgba(79,123,255,0.06)':'';
    const latestStr=prem!==null?(prem>0?'+':'')+prem.toFixed(4)+'%':'-';
    const avgStr=avg!=='-'?(Number(avg)>0?'+':'')+avg+'%':'-';
    const maxStr=maxP!=='-'?'+'+maxP+'%':'-';
    const minStr=minP!=='-'?minP+'%':'-';
    const navDate=premRecord?(premRecord.nav_date||premRecord.date):'-';
    trs+=`<tr style="${bg}"><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${COLORS[i%COLORS.length]};margin-right:6px"></span>${etf.name}</td><td class="${premiumClass(prem)}">${latestStr}</td><td>${navDate}</td><td>${avgStr}</td><td class="pos-val">${maxStr}</td><td class="neg-val">${minStr}</td></tr>`;
  });
  document.getElementById('chartArea').innerHTML=
    renderRangeBtns(currentRange)+
    '<div class="alert-warn"><span>&#9888;</span>溢价 &gt; 1% 时慎买，折价 &lt; -1% 时为买入机会。QDII ETF因额度限制有时长期处于溢价。</div>'+
    '<div class="chart-card"><h3>折溢价率走势</h3><div class="chart-desc">溢价率 = (市价 - 净值) / 净值 &#215; 100%，正值=溢价，负值=折价</div><div class="chart-wrapper"><canvas id="chartPremium"></canvas></div></div>'+
    '<div class="chart-card"><h3>折溢价统计对比（'+(currentRange==='3m'?'近3个月':currentRange==='6m'?'近6个月':currentRange==='1y'?'近1年':'全部')+'）</h3><div class="chart-desc">最新值 / 均值 / 最高最低</div>'+
    '<table class="premium-table"><thead><tr><th>基金</th><th>最新溢价率</th><th>使用净值日期</th><th>区间均值</th><th>区间最高</th><th>区间最低</th></tr></thead><tbody>'+trs+'</tbody></table></div>';
  bindRangeBtns();
  const {allDates,datasets}=buildDatasets('premium');
  makeLineChart('chartPremium',allDates,datasets,v=>v!=null?v.toFixed(3)+'%':'-');
}

function passiveSortValue(etf,key){
  if(key==='fee_total'||key==='fee_mgmt'||key==='fee_cust')return Number(etf[key]);
  if(key==='purchase_limit')return etf.purchase_limit==null?Infinity:Number(etf.purchase_limit);
  if(key==='purchase_status')return /暂停/.test(etf.purchase_status||'')?1:0;
  return 0;
}
function passiveSortHeader(label,key){
  const active=passiveSort.key===key;
  return `<th class="passive-sortable" data-passive-sort="${key}" title="点击排序">${label}<span class="passive-sort-icon">${active?(passiveSort.dir===1?'▲':'▼'):'↕'}</span></th>`;
}
function bindPassiveTable(){
  document.querySelectorAll('[data-passive-sort]').forEach(th=>th.addEventListener('click',()=>{
    const key=th.dataset.passiveSort;
    passiveSort=passiveSort.key===key?{key,dir:-passiveSort.dir}:{key,dir:1};
    renderNavTab();
  }));
  const select=document.getElementById('passiveStatusFilter');
  if(select)select.addEventListener('change',e=>{passiveStatusFilter=e.target.value;renderNavTab();});
}

function renderNavTab(){
  const statusLabel=passiveStatusFilter==='all'?'全部':passiveStatusFilter==='available'?'可购':'暂停';
  const funds=ETF_CODES.map((code,i)=>({code,i,etf:ETF_DATA_ACTIVE[code]})).filter(item=>{
    const status=item.etf.purchase_status||'';
    return passiveStatusFilter==='all'||(passiveStatusFilter==='available'&&!/暂停/.test(status))||(passiveStatusFilter==='paused'&&/暂停/.test(status));
  });
  if(passiveSort.key)funds.sort((a,b)=>{
    const av=passiveSortValue(a.etf,passiveSort.key),bv=passiveSortValue(b.etf,passiveSort.key);
    return av===bv?a.code.localeCompare(b.code):(av-bv)*passiveSort.dir;
  });
  const rows=funds.map(item=>{
    const {code,i,etf}=item;
    const navArr=etf.nav||[];
    const latest=navArr.length?navArr[navArr.length-1]:null;
    const previous=navArr.length>1?navArr[navArr.length-2]:null;
    const dailyChange=latest&&previous&&previous.value?((latest.value/previous.value-1)*100):null;
    const color=COLORS[i%COLORS.length];
    const status=etf.purchase_status||'待更新';
    const paused=/暂停/.test(status);
    const limit=etf.purchase_limit===null||etf.purchase_limit===undefined?'—':('¥'+Number(etf.purchase_limit).toFixed(2));
    const share=etf.share_code?`<div class="passive-code">C类：${etf.share_code}</div>`:'';
    return `<tr>
      <td><div class="passive-name"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:6px"></span>${etf.name}</div><div class="passive-code">A类：${code}</div>${share}</td>
      <td class="passive-nav">${latest?Number(latest.value).toFixed(4):'—'}</td>
      <td>${latest?latest.date:'—'}</td>
      <td class="${dailyChange===null?'passive-muted':dailyChange>=0?'pos-val':'neg-val'}">${dailyChange===null?'—':(dailyChange>=0?'+':'')+dailyChange.toFixed(2)+'%'}</td>
      <td>${etf.size==null?'—':Number(etf.size).toFixed(2)+' 亿'}</td>
      <td class="passive-fee">${Number(etf.fee_total).toFixed(2)}%</td>
      <td>${Number(etf.fee_mgmt).toFixed(2)}%</td>
      <td>${Number(etf.fee_cust).toFixed(2)}%</td>
      <td><span class="passive-status${paused?' paused':''}">${status}</span></td>
      <td class="passive-limit">${limit}</td>
      <td class="passive-muted">${etf.purchase_checked_at||'—'}</td>
    </tr>`;
  }).join('');
  document.getElementById('chartArea').innerHTML=
    '<div class="alert-info"><span>&#128161;</span>场外基金不产生场内折溢价，本页改为一张总表展示净值、涨跌、费率、规模及申购额度；净值为基金公司公布的单位净值，通常存在披露滞后。</div>'+
    '<div class="chart-card"><div class="passive-toolbar"><div><h3>纳指被动 · 场外 QDII 基金总览</h3><div class="chart-desc">共 '+funds.length+' / '+ETF_CODES.length+' 只基金 · 点击表头可升序/降序排序</div></div><label class="passive-filter-label">申购状态<select id="passiveStatusFilter" class="passive-filter"><option value="all"'+(passiveStatusFilter==='all'?' selected':'')+'>全部</option><option value="available"'+(passiveStatusFilter==='available'?' selected':'')+'>可购</option><option value="paused"'+(passiveStatusFilter==='paused'?' selected':'')+'>暂停</option></select></label></div><div class="passive-table-wrap"><table class="passive-table"><thead><tr><th>基金名称 / 代码</th><th>最新净值</th><th>净值日期</th><th>日涨跌</th><th>规模</th>'+passiveSortHeader('综合费率','fee_total')+passiveSortHeader('管理费','fee_mgmt')+passiveSortHeader('托管费','fee_cust')+passiveSortHeader('申购状态','purchase_status')+passiveSortHeader('单日额度','purchase_limit')+'<th>额度检查时间</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="passive-source">当前筛选：'+statusLabel+'。数据说明：净值来自公开基金净值数据；申购状态/额度来自天天基金公开页面检查结果。不同销售渠道可能不同，实际申购请以基金公司或对应销售平台当日页面为准。</div></div>';
}

function renderInfoTab(){
  const cards=ETF_CODES.map((code,i)=>{
    const etf=ETF_DATA_ACTIVE[code];const color=COLORS[i%COLORS.length];
    const isOtc=etf.type==='otc';
    const price=isOtc?null:getLatestPrice(code);const prem=isOtc?null:getLatestPremium(code);
    const feeW=((etf.fee_total-0.60)/(1.05-0.60)*100).toFixed(0);
    const isSel=selectedCodes.has(code);
    const borderStyle=isSel?'border-color:'+color+'55':'';
    const priceHtml=price!==null?`<div style="font-size:15px;font-weight:700;color:#fff">&#165;${price.toFixed(3)}</div>`:'';
    const premHtml=prem!==null?`<div class="${premiumBadgeClass(prem)} etf-premium-badge">${prem>0?'+':''}${prem.toFixed(2)}%</div>`:'';
    const quotaHtml=isOtc?`<div class="metric"><span class="metric-label">申购状态</span><span class="metric-value">${etf.purchase_status||'待更新'}</span></div><div class="metric"><span class="metric-label">单日申购上限</span><span class="metric-value" style="color:#fbbf24">${etf.purchase_limit===null?'—':etf.purchase_limit+'元'}</span></div><div style="font-size:11px;color:#8892a4;margin-top:8px">公开页面检查：${etf.purchase_checked_at||'—'}；不同销售渠道可能不同</div>`:'';
    return`<div class="info-card" style="${borderStyle}"><div class="card-header"><div><div class="card-name" style="color:${color}">${etf.name}</div><div class="card-code">${code.toUpperCase()}${etf.share_code?' · C类 '+etf.share_code:''} &#183; ${INDEX_TAGS[currentIndex]}</div></div><div style="text-align:right">${priceHtml}${premHtml}</div></div><div class="metric"><span class="metric-label">规模（亿元）</span><span class="metric-value" style="color:#fbbf24">${etf.size}</span></div><div class="metric"><span class="metric-label">综合费率</span><span class="metric-value" style="color:${feeColor(etf.fee_total)}">${etf.fee_total}%/年</span></div><div class="metric"><span class="metric-label">管理费</span><span class="metric-value">${etf.fee_mgmt}%</span></div><div class="metric"><span class="metric-label">托管费</span><span class="metric-value">${etf.fee_cust}%</span></div><div class="metric"><span class="metric-label">销售服务费</span><span class="metric-value">${etf.fee_svc}%</span></div>${quotaHtml}<div class="fee-bar"><div class="fee-fill" style="width:${feeW}%;background:${feeColor(etf.fee_total)}"></div></div></div>`;
  }).join('');
  document.getElementById('chartArea').innerHTML=
    '<div class="alert-info" style="margin-bottom:16px"><span>&#128161;</span>费率进度条越长=费率越高。溢价徽章：红=溢价，绿=折价。</div>'+
    '<div class="info-grid">'+cards+'</div>';
}

function renderValuationTab(){
  if(typeof NDX_VALUATION==='undefined'||!NDX_VALUATION.series||!NDX_VALUATION.series.length){
    document.getElementById('chartArea').innerHTML='<div class="alert-warn"><span>&#9888;</span>暂无 NDX 估值数据。</div>';
    return;
  }
  const s=NDX_VALUATION.series;
  const last=s[s.length-1];
  const today=new Date().toISOString().slice(0,10);

  const badge=(pct)=>{
    if(pct===null||pct===undefined) return '—';
    const color=pct<30?'#22c55e':pct<70?'#f59e0b':'#ef4444';
    return `<span style="color:${color};font-weight:700">${pct}%</span>`;
  };
  const cell=(label,val,sub)=>`<div class="metric"><span class="metric-label">${label}</span><span class="metric-value">${val}${sub?`<span style="color:#8892a4;font-size:11px;margin-left:4px">${sub}</span>`:''}</span></div>`;

  const peDate = last.pe_history_date || last.date;
  const fwdDate = last.forward_history_date || last.date;
  const checked = last.checked || NDX_VALUATION.updated || '';
  const staleReasons=[];
  if(peDate!==today) staleReasons.push(`TTM PE 最新数据为 ${peDate}`);
  if(fwdDate!==today) staleReasons.push(`Forward PE 最新数据为 ${fwdDate}`);

  let html='';
  html+=`<div class="alert-info" style="margin-bottom:16px"><span>&#128161;</span>${NDX_VALUATION.source || 'NDX 估值参考'}。不同数据商对亏损股处理、EPS 时点、加权方式的差异会导致 TTM PE 数值略有不同；蛋卷 31.31 与 HOM 28.49 并非错误，而是口径不同。仅供参考，非投资建议。</div>`;
  if(staleReasons.length){
    html+=`<div class="alert-warn" style="margin-bottom:16px"><span>&#9888;</span>${staleReasons.join('；')}。面板于 ${checked || today} 刷新，数据源尚未发布新数据或发布频率较低（Forward PE 通常为周更）。</div>`;
  }

  html+='<div class="info-grid"><div class="info-card" style="border-color:#4f7bff55">';
  html+=`<div class="card-header"><div><div class="card-name" style="color:#4f7bff">纳斯达克100 (NDX) 估值</div><div class="card-code">刷新于 ${checked || today} ${last.label?'&#183; 蛋卷综合：'+last.label:''}</div></div></div>`;
  html+=cell('TTM PE', last.pe==null?'—':last.pe, `数据日期 ${peDate}`);
  html+=cell('PE 历史百分位', badge(last.pe_pct), last.pe_pct!=null?'越低越便宜':'');
  html+=cell('Forward PE (12m)', last.forward_pe==null?'—':last.forward_pe, `数据日期 ${fwdDate}`);
  html+=cell('Forward PE 百分位', badge(last.forward_pe_pct), last.forward_pe_pct!=null?'基于 2001 年至今 forward PE 序列':'');
  html+=cell('市净率 PB', last.pb==null?'—':last.pb, '');
  html+=cell('PB 历史百分位', last.pb_pct==null?'—':last.pb_pct+'%', '');
  html+=cell('ROE', last.roe==null?'—':last.roe+'%', '');
  html+=cell('股息率', last.dividend_yield==null?'—':last.dividend_yield+'%', '');
  html+=cell('预测 PEG', last.peg==null?'—':last.peg, '');
  html+=cell('综合位置', last.position_pct==null?'—':`比过去 ${last.position_pct}% 的时间低`, '');
  html+='</div>';
  html+='<div class="info-card" style="border-color:#84cc1655"><div class="card-header"><div><div class="card-name" style="color:#84cc16">PE 分位数参考</div><div class="card-code">30 / 中位 / 70 分位 PE</div></div></div>';
  html+=cell('30 分位', last.pe_30==null?'—':last.pe_30, '');
  html+=cell('中位值', last.pe_mid==null?'—':last.pe_mid, '');
  html+=cell('70 分位', last.pe_70==null?'—':last.pe_70, '');
  html+='</div></div>';

  if(s.length>=2){
    const labels=s.map(d=>d.date);
    const peData=s.map(d=>d.pe);
    const fwdData=s.map(d=>d.forward_pe);
    const datasets=[{label:'TTM PE',data:peData,borderColor:'#4f7bff',backgroundColor:'#4f7bff12',borderWidth:1.8,pointRadius:0,tension:0.3}];
    if(fwdData.some(v=>v!=null)){
      datasets.push({label:'Forward PE',data:fwdData,borderColor:'#22c55e',backgroundColor:'#22c55e12',borderWidth:1.8,pointRadius:0,tension:0.3});
    }
    html+='<div class="chart-card"><h3>PE 历史走势</h3><div class="chart-desc">自动更新后积累；蓝线=TTM PE，绿线=Forward PE</div><div class="chart-wrapper"><canvas id="chartValPe"></canvas></div></div>';
    document.getElementById('chartArea').innerHTML=html;
    makeLineChart('chartValPe',labels,datasets,v=>v!=null?v.toFixed(2):'-');
  }else{
    html+='<div class="alert-info" style="margin-top:16px"><span>&#128161;</span>当前仅 1 个数据点，PE 历史趋势图将在每日自动更新积累更多数据后显示。</div>';
    document.getElementById('chartArea').innerHTML=html;
  }
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');currentTab=t.dataset.tab;renderAll();
}));
document.querySelectorAll('.index-switch-btn').forEach(b=>b.addEventListener('click',()=>switchIndex(b.dataset.idx)));
document.getElementById('chkAll').addEventListener('change',e=>{
  if(e.target.checked)ETF_CODES.forEach(c=>selectedCodes.add(c));
  else{selectedCodes.clear();selectedCodes.add(ETF_CODES[0]);}
  renderAll();
});
document.getElementById('idxSub').textContent=INDEX_SUBS[currentIndex];
renderAll();

// 显示脚本自动更新时间（GitHub Actions 写入 data/_last_update.json）
fetch('data/_last_update.json').then(r=>r.ok?r.json():null).then(d=>{
  if(d&&d.last_run_bj){
    LAST_UPDATE_NOTE='自动更新于 '+d.last_run_bj+(d.trigger==='schedule'?' (定时)':' (手动)');
    updateFreshness();
  }
}).catch(()=>{});
</script>
