name: One-off ETF Mail Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-mail-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test-email:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send one-off SMTP test email
        run: python premium_alert.py test-email
        env:
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_SMTP_PORT: ${{ vars.ALERT_SMTP_PORT }}
