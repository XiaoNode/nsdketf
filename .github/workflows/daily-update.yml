name: Daily ETF Update

on:
  schedule:
    # GitHub Actions 的 schedule 是"尽力而为", 不保证准点 —— 实测本仓库常延迟 20~45 分钟,
    # 约半数会被推到次日凌晨。因此改为一天多跑几轮互补: 早一轮拿当日收盘价, 晚几轮等 QDII
    # 净值陆续披露后补齐溢价率。各轮幂等 —— 数据无变化时不会 commit, 也不会触发 Pages 部署。
    # 分钟数刻意取 :20 而非整点/半点: Actions 调度高峰在整点, 错开可明显减少排队时间。
    # 限定 UTC 周一至周五 (对应北京周一晚 ~ 周六凌晨), 周末与美股休市不空跑。
    # 北京 20:20 —— 首跑: 当日收盘价已出, 早披露的净值一并收入
    - cron: '20 12 * * 1-5'
    # 北京 22:20 —— 主力: 多数 QDII 基金 T-1 净值已披露, 溢价率基本成型
    - cron: '20 14 * * 1-5'
    # 北京 次日 00:20 —— 补漏: 覆盖披露较晚的基金公司
    - cron: '20 16 * * 1-5'
    # 北京 次日 08:20 —— 兜底: 前一晚若被严重延迟或失败, 早上补一次
    - cron: '20 0 * * 1-5'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 允许 workflow 提交更新后的数据文件

concurrency:
  group: etf-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史以便 commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily update
        run: python daily_update.py
        env:
          TZ: Asia/Shanghai  # 确保日期计算使用北京时间

      - name: Record update timestamp
        run: |
          mkdir -p data
          printf '{"last_run_utc":"%s","last_run_bj":"%s","trigger":"%s"}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" \
            "${{ github.event_name }}" > data/_last_update.json
          echo "Wrote data/_last_update.json: $(cat data/_last_update.json)"

      - name: Validate generated data
        run: python -m unittest discover -s tests -v

      - name: Check for changes
        id: verify
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated data
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-update ETF data [$(date +'%Y-%m-%d %Z')]"
          git push

      - name: Deploy to GitHub Pages
        if: steps.verify.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          # 只发布前端需要的文件，避免把 .github / 脚本推到 Pages
          exclude_assets: |
            .github
            daily_update.py
            fetch_etf_data.py
            fetch_etf_data_v2.py
            add_etf_159509.py
            tests
            requirements.txt
            README.md
            .gitignore
