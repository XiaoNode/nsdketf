name: Daily ETF Update

on:
  schedule:
    # 北京时间每天 21:30 初次抓取（A股已收盘，价格当日更新）
    - cron: '30 13 * * *'
    # 北京时间每天 23:00 补抓（QDII T-1 净值基本披露完成，补全溢价）
    - cron: '0 15 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 允许 workflow 提交更新后的数据文件

concurrency:
  group: etf-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史以便 commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily update
        run: python daily_update.py
        env:
          TZ: Asia/Shanghai  # 确保日期计算使用北京时间

      - name: Record update timestamp
        run: |
          mkdir -p data
          printf '{"last_run_utc":"%s","last_run_bj":"%s","trigger":"%s"}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" \
            "${{ github.event_name }}" > data/_last_update.json
          echo "Wrote data/_last_update.json: $(cat data/_last_update.json)"

      - name: Validate generated data
        run: python -m unittest discover -s tests -v

      - name: Check for changes
        id: verify
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated data
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-update ETF data [$(date +'%Y-%m-%d %Z')]"
          git push

      - name: Deploy to GitHub Pages
        if: steps.verify.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          # 只发布前端需要的文件，避免把 .github / 脚本推到 Pages
          exclude_assets: |
            .github
            daily_update.py
            fetch_etf_data.py
            fetch_etf_data_v2.py
            add_etf_159509.py
            tests
            requirements.txt
            README.md
            .gitignore
